server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backup files are uploaded through /import/; the 1 MB nginx default would
    # reject any export bigger than a few hundred entries.
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # Proxy API requests to the backend.
    # Every backend prefix must appear here — a route missing from this list is
    # served the SPA's index.html instead, which surfaces as a JSON parse error.
    location ~ ^/(auth|export|import|groups|trackers|dashboard|health|version|docs|redoc|openapi) {
        # BACKEND_HOST is substituted at container start; see the Dockerfile,
        # which installs this file as an nginx template.
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend decides whether to mark the auth cookie Secure from this
        # header, so it must reflect how the browser actually connected.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the previous
    # release's asset names after an upgrade.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve the React SPA — fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
